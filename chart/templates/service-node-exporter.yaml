apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-node-exporter
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    app: node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
