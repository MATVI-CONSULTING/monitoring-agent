# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

agent:
  image: "ghcr.io/matvi-consulting/monitoring-agent-docker:1.7.0"
  url: "https://push.prod.matvi-consulting.com"   # sans le suffixe /metrics
  basicAuth:
    username: ""
    password: ""

  # Grouping labels ajoutées au chemin Pushgateway
  labels:
    # par défaut, on injectera .Release.Namespace au runtime si 'cluster' est vide
    cluster: ""
    env: ""
    client: ""
  resources:
    requests: { cpu: 200m, memory: 50Mi }
    limits:   { cpu: 250m, memory: 100Mi }
  nodeExporter:
    pushInterval: 30
  cadvisor:
    pushInterval: 30
  kubeStateMetrics:
    pushInterval: 30
  databaseMonitoring:
    pushInterval: 30
  rabbitmqMonitoring:
    pushInterval: 30
  httpProbe:
    pushInterval: 30

nodeExporter:
  image: "quay.io/prometheus/node-exporter:v1.12.1"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 200m, memory: 512Mi }

kubeStateMetrics:
  image: "registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0"
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 200m, memory: 512Mi }

databaseMonitoring:
  enabled: false
  extraEnv: []
  # - name: OVH_DB_1_URL
  #   value: "my-value"
  # - name: OVH_DB_1_NAME
  #   value: "my-value"
  # - name: OVH_DB_2_URL
  #   value: "my-value"
  # - name: OVH_DB_2_NAME
  #   value: "my-value"

rabbitmqMonitoring:
  enabled: false
  # Racine du plugin prometheus de RabbitMQ, SANS suffixe. L'agent lit deux
  # URL : « <endpoint>/per-object » pour les metriques par file, qui seules
  # portent le label `queue`, et « <endpoint> » pour les alarmes du noeud et
  # l'etat du cluster, que per-object n'expose pas.
  #
  # Pointer directement /metrics/per-object ferait disparaitre quatre alertes
  # (alarmes memoire, disque, file descriptors, peers injoignables) sans le
  # moindre signal.
  endpoint: ""
  # endpoint example: "http://i2s-app-rabbitmq.prod.svc.cluster.local:15692/metrics"
  #
  # Files a ne jamais faire alerter : typiquement des tampons circulaires
  # bornes par x-max-length, sans consumer par construction, donc pleins en
  # permanence. L'exclusion agit sur le label `queue` ; si elle ne retire
  # aucune ligne, l'agent le signale dans ses logs.
  excludedQueues: ""
  # excludedQueues example: "data.copy,life.copy"

# Sonde HTTP : pod dedie, sans exporter local. Il vise le DOMAINE PUBLIC des
# sites (pas un Service interne) pour tester aussi le DNS public et le TLS.
httpProbe:
  enabled: false
  interval: 60        # secondes entre deux requetes reelles
  tlsInterval: 3600   # secondes entre deux lectures du certificat
  connectTimeout: 5
  maxTime: 10
  probes: []
  # - url: "https://www.mon-domaine.tld"
  #   name: "site-vitrine"          # sert de label `instance` (defaut: probe-N)
  #   expectedStatus: "200"         # liste CSV acceptee, ex. "200,302"
  # - url: "https://api.mon-domaine.tld/health"
  #   name: "api"

kubeletCadvisorPusher:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 200m, memory: 512Mi }
  filters:
    include: []   # e.g. ['^(container_cpu_|container_memory_)']
    exclude: []   # e.g. ['^container_network_.*']

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
