{{- if .Values.crowdsecMonitoring.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-crowdsec-monitoring
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      app: crowdsec-monitoring
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app: crowdsec-monitoring
    spec:
      serviceAccountName: {{ include "chart.fullname" . }}-crowdsec-monitoring
      containers:
        - name: agent
          image: {{ .Values.agent.image }}
          securityContext:
            {{- toYaml .Values.agent.securityContext | nindent 12 }}
          env:
            # Pas de node-exporter dans ce pod : cf. deployment-rabbitmq-monitoring.yaml.
            - name: ENABLE_STANDARD
              value: "false"
            {{- with .Values.crowdsecMonitoring.endpoint }}
            - name: CROWDSEC_ENDPOINT
              value: "{{ . }}"
            {{- end }}
            {{- with .Values.crowdsecMonitoring.bouncerEndpoint }}
            - name: CROWDSEC_BOUNCER_ENDPOINT
              value: "{{ . }}"
            {{- end }}
            {{- with .Values.crowdsecMonitoring.ignoredBouncers }}
            - name: CROWDSEC_IGNORED_BOUNCERS
              value: "{{ . }}"
            {{- end }}
            - name: PUSH_INTERVAL
              value: "{{ .Values.agent.crowdsecMonitoring.pushInterval }}"
            - name: INSTANCE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLUSTER
              value: "{{ default .Release.Namespace .Values.agent.labels.cluster }}"
            - name: ENV
              value: "{{ .Values.agent.labels.env }}"
            - name: CUSTOMER_NAME
              value: "{{ default .Release.Namespace .Values.agent.labels.client }}"
            - name: AGENT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.fullname" . }}-agent-basic-auth
                  key: username
            - name: AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.fullname" . }}-agent-basic-auth
                  key: password
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
{{- end }}
