{{- if .Values.dnsProbe.enabled }}
# Aucun RBAC : la liste des hosts vient de kube-state-metrics, pas de l'API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart.fullname" . }}-dns-probe
  labels:
    {{- include "chart.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
