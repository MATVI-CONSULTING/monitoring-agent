apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-kube-state-metrics
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      app: kube-state-metrics
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app: kube-state-metrics
    spec:
      serviceAccountName: {{ include "chart.fullname" . }}-kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: {{ .Values.kubeStateMetrics.image }}
          ports:
            - name: http-metrics
              containerPort: 8080
          resources:
            {{- toYaml .Values.kubeStateMetrics.resources | nindent 12 }}
        - name: agent
          image: {{ .Values.agent.image }}
          env:
            - name: AGENT_URL
              value: {{ .Values.agent.url | quote }}
            - name: AGENT_INTERVAL
              value: "{{ .Values.agent.intervalSeconds }}"
            - name: SCRAPE_URL
              value: "http://127.0.0.1:8080/metrics"
            - name: JOB_NAME
              value: "kube-state-metrics"
            - name: INSTANCE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLUSTER
              value: "{{ default .Release.Namespace .Values.agent.labels.cluster }}"
            - name: ENV
              value: "{{ .Values.agent.labels.env }}"
            - name: CLIENT
              value: "{{ default .Release.Namespace .Values.agent.labels.client }}"
            - name: AGENT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.fullname" . }}-agent-basic-auth
                  key: username
            - name: AGENT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.fullname" . }}-agent-basic-auth
                  key: password
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              while true; do
                curl -fsS ${SCRAPE_URL} \
                | curl -fsS -u "${AGENT_USER}:${AGENT_PASS}" -X PUT \
                    --data-binary @- \
                    "${AGENT_URL}/metrics/job/${JOB_NAME}/instance/${INSTANCE}/client/${CLIENT}/cluster/${CLUSTER}/env/${ENV}" || true
                sleep "${AGENT_INTERVAL}"
              done
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
