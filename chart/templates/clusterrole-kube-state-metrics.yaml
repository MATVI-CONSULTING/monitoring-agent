apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chart.fullname" . }}-kube-state-metrics
  labels:
    {{- include "chart.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [configmaps,endpoints,events,limitranges,namespaces,nodes,persistentvolumeclaims,persistentvolumes,pods,replicationcontrollers,resourcequotas,secrets,services,serviceaccounts]
  verbs: [list,watch]
- apiGroups: ["apps"]
  resources: [daemonsets,deployments,replicasets,statefulsets]
  verbs: [list,watch]
- apiGroups: ["batch"]
  resources: [cronjobs,jobs]
  verbs: [list,watch]
- apiGroups: ["autoscaling"]
  resources: [horizontalpodautoscalers]
  verbs: [list,watch]
- apiGroups: ["networking.k8s.io"]
  resources: [ingresses,networkpolicies]
  verbs: [list,watch]
- apiGroups: ["policy"]
  resources: [poddisruptionbudgets]
  verbs: [list,watch]
- apiGroups: ["coordination.k8s.io"]
  resources: [leases]
  verbs: [list,watch]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: [mutatingwebhookconfigurations,validatingwebhookconfigurations]
  verbs: [list,watch]
- apiGroups: ["extensions"]
  resources: [ingresses]
  verbs: [list,watch]
- apiGroups: ["storage.k8s.io"]
  resources: [storageclasses,volumeattachments]
  verbs: [list,watch]
- apiGroups: ["authorization.k8s.io"]
  resources: [subjectaccessreviews,selfsubjectaccessreviews]
  verbs: [create]
- apiGroups: ["certificates.k8s.io"]
  resources: [certificatesigningrequests]
  verbs: [list,watch]
- apiGroups: ["discovery.k8s.io"]
  resources: [endpointslices]
  verbs: [list,watch]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: [clusterrolebindings,clusterroles,roles,rolebindings]
  verbs: [list,watch]
