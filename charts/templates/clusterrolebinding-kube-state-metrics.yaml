apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chart.fullname" . }}-kube-state-metrics
  labels:
    {{- include "chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chart.fullname" . }}-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: {{ include "chart.fullname" . }}-kube-state-metrics
    namespace: {{ .Release.Namespace }}
