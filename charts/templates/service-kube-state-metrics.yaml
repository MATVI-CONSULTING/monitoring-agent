apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-kube-state-metrics
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    app: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
